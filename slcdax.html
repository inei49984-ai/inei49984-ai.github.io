<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slcdax</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ヘッダー / メニューボタン */
        .header {
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .header-menu-btn {
            background: none;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .header-menu-btn:active {
            background: #222222;
        }

        /* メインコンテンツ */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .hero-title {
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .site-description {
            font-size: 15px;
            color: #888888;
            margin-bottom: 48px;
            line-height: 1.6;
        }

        /* ファイルカード一覧 */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .file-card {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .file-card-sub {
            font-size: 13px;
            color: #666666;
        }

        .game-link {
            font-size: 12px;
            color: #888888;
            text-decoration: underline;
            width: fit-content;
        }

        .file-card-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .btn-secondary:active {
            background: #222222;
        }

        /* モーダル (ダイアログ) */
        .ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        .ui-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .ui-console {
            width: 90%;
            max-width: 500px;
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 24px;
        }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .ui-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .ui-close-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 18px;
            cursor: pointer;
        }

        .sns-link-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sns-card {
            padding: 14px 16px;
            background: #000000;
            border: 1px solid #222222;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .code-block-wrapper {
            background: #000000;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .code-block-wrapper code {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #cccccc;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }

        /* フッター */
        .footer {
            padding: 32px;
            text-align: center;
            border-top: 1px solid #111111;
            color: #444444;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-logo">slcdax</div>
        <button class="header-menu-btn" id="global-menu-btn">Menu</button>
    </header>

    <main class="container">
        <h1 class="hero-title">Script distribution.</h1>
        <p class="site-description">ineiにより作成されたscriptを配布しています。</p>

        <div class="file-list">
            <div class="file-card">
                <div class="file-info">
                    <div class="file-card-title">巨人の時代（ゴジラのゲーム）script</div>
                    <div class="file-card-sub">.lua</div>
                </div>
                <a class="game-link" href="https://www.roblox.com/ja/games/89851325271396/Age-of-Titans" target="_blank">Robloxでゲームを開く ↗</a>
                <div class="file-card-actions">
                    <button class="btn" data-file="kyojin" data-mode="download">ダウンロード</button>
                    <button class="btn btn-secondary" data-file="kyojin" data-mode="raw">RAW表示</button>
                </div>
            </div>

            <div class="file-card">
                <div class="file-info">
                    <div class="file-card-title">増殖アイテム</div>
                    <div class="file-card-sub">.lua (全ゲーム対応)</div>
                </div>
                <div class="file-card-actions">
                    <button class="btn" data-file="zoshoku" data-mode="download">ダウンロード</button>
                    <button class="btn btn-secondary" data-file="zoshoku" data-mode="raw">RAW表示</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        © slcdax
    </footer>

    <!-- Menu Modal -->
    <div class="ui-overlay" id="ui-overlay">
        <div class="ui-console">
            <div class="ui-header">
                <span class="ui-title">Developer SNS</span>
                <button class="ui-close-btn" id="ui-close-btn">✕</button>
            </div>
            <div class="sns-link-list">
                <a href="https://discord.gg/DgghS5AtvU" target="_blank" class="sns-card">Discord ↗</a>
                <a href="https://github.com/inei49984-ai" target="_blank" class="sns-card">GitHub ↗</a>
            </div>
        </div>
    </div>

    <!-- RAW Code Modal -->
    <div class="ui-overlay" id="code-modal">
        <div class="ui-console">
            <div class="ui-header">
                <span class="ui-title" id="code-modal-filename">Script View</span>
                <button class="ui-close-btn" id="code-modal-close-btn">✕</button>
            </div>
            <div class="code-block-wrapper">
                <code id="code-target"></code>
            </div>
            <button class="btn" id="btn-copy" style="width: 100%;">コピー</button>
        </div>
    </div>

    <script>
    /* SCRIPT DATA & ACTIONS (.lua保存対応) */
    const LUA_FILES = {
        kyojin: {
            filename: '巨人の時代.lua',
            content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/gozila-game-roblox/refs/heads/main/gizlia%20sciprt.lua"))()'
        },
        zoshoku: {
            filename: '増殖アイテム.lua',
            content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/poopzous/refs/heads/main/unchikhub.lua"))()'
        }
    };

    function downloadLua(key) {
        const file = LUA_FILES[key];
        if (!file) return;

        const blob = new Blob([file.content], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 100);
    }

    /* Menu Control */
    const globalMenuBtn = document.getElementById('global-menu-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const uiCloseBtn = document.getElementById('ui-close-btn');

    globalMenuBtn.addEventListener('click', () => uiOverlay.classList.add('open'));
    uiCloseBtn.addEventListener('click', () => uiOverlay.classList.remove('open'));
    uiOverlay.addEventListener('click', e => { if (e.target === uiOverlay) uiOverlay.classList.remove('open'); });

    /* RAW Code Control */
    const codeModal = document.getElementById('code-modal');
    const codeModalCloseBtn = document.getElementById('code-modal-close-btn');
    const codeTarget = document.getElementById('code-target');
    const codeModalFilename = document.getElementById('code-modal-filename');
    const btnCopy = document.getElementById('btn-copy');

    function openCodeModal(key) {
        const file = LUA_FILES[key];
        if (!file) return;
        codeModalFilename.textContent = file.filename;
        codeTarget.textContent = file.content;
        codeModal.classList.add('open');
    }

    function closeCodeModal() {
        codeModal.classList.remove('open');
        btnCopy.textContent = 'コピー';
    }

    codeModalCloseBtn.addEventListener('click', closeCodeModal);
    codeModal.addEventListener('click', e => { if (e.target === codeModal) closeCodeModal(); });

    btnCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(codeTarget.textContent).then(() => {
            btnCopy.textContent = 'コピー完了！';
            setTimeout(() => btnCopy.textContent = 'コピー', 2000);
        });
    });

    document.querySelectorAll('.file-card-actions button').forEach(btn => {
        btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-file');
            const mode = btn.getAttribute('data-mode');
            if (mode === 'download') downloadLua(key);
            else if (mode === 'raw') openCodeModal(key);
        });
    });
    </script>
</body>
</html>
