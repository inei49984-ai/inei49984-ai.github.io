
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slcdax</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #000000;
            --header-border: #222222;
            --logo-color: #ffffff;
            --text-title: #ffffff;
            --text-sub: #ffffff;
            --card-bg: #0d0d0d;
            --card-border: #222222;
            --card-hover-border: #555555;
            --link-bg: #111111;
            --link-border: #222222;
            --link-text: #ffffff;
            --btn-dl-bg: #2563eb;
            --btn-dl-text: #ffffff;
            --btn-dl-hover: #1d4ed8;
            --btn-sec-bg: #181818;
            --btn-sec-text: #ffffff;
            --btn-sec-border: #333333;
            --badge-green-bg: rgba(34, 197, 94, 0.15);
            --badge-green-border: #22c55e;
            --badge-green-text: #4ade80;
            --overlay-bg: rgba(0, 0, 0, 0.85);
            --modal-bg: #0a0a0a;
            --modal-border: #222222;
            --code-bg: #000000;
            --code-text: #ffffff;
            --footer-border: #222222;
            --footer-text: #b0b0b0;
            --icon-fill: #ffffff;
        }

        body.light-mode {
            --bg-color: #ffffff;
            --header-border: #e5e5e5;
            --logo-color: #000000;
            --text-title: #000000;
            --text-sub: #333333;
            --card-bg: #f9f9f9;
            --card-border: #e5e5e5;
            --card-hover-border: #999999;
            --link-bg: #f0f0f0;
            --link-border: #e0e0e0;
            --link-text: #000000;
            --btn-dl-bg: #2563eb;
            --btn-dl-text: #ffffff;
            --btn-dl-hover: #1d4ed8;
            --btn-sec-bg: #ffffff;
            --btn-sec-text: #000000;
            --btn-sec-border: #ccc;
            --badge-green-bg: #dcfce7;
            --badge-green-border: #86efac;
            --badge-green-text: #15803d;
            --overlay-bg: rgba(255, 255, 255, 0.85);
            --modal-bg: #ffffff;
            --modal-border: #e5e5e5;
            --code-bg: #f4f4f4;
            --code-text: #000000;
            --footer-border: #e5e5e5;
            --footer-text: #555555;
            --icon-fill: #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }

        .header {
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--header-border);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--logo-color);
        }

        .header-logo-icon {
            height: 42px;
            width: 42px;
            object-fit: contain;
            border-radius: 50%;
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-toggle-btn {
            height: 40px;
            padding: 0 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-title);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lang-toggle-btn:active,
        .lang-toggle-btn.is-pressed {
            transform: scale(0.92);
        }

        .theme-toggle-btn {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--icon-fill);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .theme-toggle-btn:active,
        .theme-toggle-btn.is-pressed {
            transform: scale(0.92);
        }

        .header-menu-btn {
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-bar {
            width: 18px;
            height: 2px;
            background-color: var(--icon-fill);
            border-radius: 2px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-menu-btn:active,
        .header-menu-btn.is-pressed {
            transform: scale(0.92);
        }

        @media (hover: hover) {
            .lang-toggle-btn:hover,
            .theme-toggle-btn:hover,
            .header-menu-btn:hover {
                border-color: var(--card-hover-border);
            }
            .header-menu-btn:hover .menu-bar:nth-child(2) {
                width: 14px;
            }
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .hero-title {
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: var(--text-title);
        }

        .site-description {
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-card.is-pressed {
            transform: scale(0.98);
        }

        @media (hover: hover) {
            .file-card:hover {
                border-color: var(--card-hover-border);
                transform: translateY(-2px);
            }
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-title);
        }

        .game-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--link-text);
            text-decoration: none;
            width: fit-content;
            padding: 6px 12px;
            background: var(--link-bg);
            border: 1px solid var(--link-border);
            border-radius: 6px;
            transition: all 0.2s ease;
            word-break: break-all;
            -webkit-touch-callout: none;
        }

        .game-link svg {
            width: 14px;
            height: 14px;
            fill: var(--icon-fill);
            flex-shrink: 0;
        }

        .game-link:hover {
            border-color: var(--card-hover-border);
        }

        .file-card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn-download {
            background: var(--btn-dl-bg);
            color: var(--btn-dl-text);
            border: 1px solid var(--btn-dl-bg);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-download:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-download:not(:disabled):active,
        .btn-download:not(:disabled).is-pressed {
            transform: scale(0.95);
            opacity: 0.9;
        }

        @media (hover: hover) {
            .btn-download:not(:disabled):hover {
                background: var(--btn-dl-hover);
                border-color: var(--btn-dl-hover);
            }
        }

        .btn-secondary {
            background: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            border: 1px solid var(--btn-sec-border);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-secondary:active,
        .btn-secondary.is-pressed {
            transform: scale(0.95);
            opacity: 0.8;
        }

        @media (hover: hover) {
            .btn-secondary:hover {
                border-color: var(--card-hover-border);
            }
        }

        .badge-all-games {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--badge-green-text);
            background: var(--badge-green-bg);
            border: 1px solid var(--badge-green-border);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .badge-all-games svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: var(--overlay-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .ui-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .ui-console {
            width: 90%;
            max-width: 500px;
            background: var(--modal-bg);
            border: 1px solid var(--modal-border);
            border-radius: 12px;
            padding: 24px;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ui-overlay.open .ui-console {
            transform: scale(1) translateY(0);
        }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .ui-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-title);
        }

        .ui-close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s ease;
        }

        .ui-close-btn:hover {
            color: var(--text-title);
        }

        .terms-content {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.7;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 16px;
            user-select: text;
            -webkit-user-select: text;
        }

        .terms-content p {
            margin-bottom: 12px;
        }

        .terms-content h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-title);
            margin-top: 16px;
            margin-bottom: 6px;
        }

        .terms-content h4:first-child {
            margin-top: 0;
        }

        .terms-content strong.warning-text {
            display: block;
            margin-top: 8px;
            color: #ef4444;
        }

        .terms-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-title);
            cursor: pointer;
            margin-bottom: 16px;
        }

        .terms-checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--btn-dl-bg);
        }

        .terms-btn-group {
            display: flex;
            gap: 12px;
        }

        .terms-btn-group button {
            flex: 1;
        }

        .sns-link-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sns-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--link-bg);
            border: 1px solid var(--link-border);
            border-radius: 8px;
            color: var(--text-title);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-touch-callout: none;
        }

        .sns-card svg {
            width: 18px;
            height: 18px;
            fill: var(--icon-fill);
            flex-shrink: 0;
        }

        .sns-card:active,
        .sns-card.is-pressed {
            transform: scale(0.98);
        }

        @media (hover: hover) {
            .sns-card:hover {
                border-color: var(--card-hover-border);
            }
        }

        .code-block-wrapper {
            background: var(--code-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .code-block-wrapper code {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--code-text);
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }

        .footer {
            padding: 32px;
            text-align: center;
            border-top: 1px solid var(--footer-border);
            color: var(--footer-text);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .terms-link-btn {
            background: none;
            border: none;
            color: var(--footer-text);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .terms-link-btn:hover {
            color: var(--text-title);
        }
    </style>
</head>

        en: {
            siteDesc: "Distributing scripts created by inei.",
            titleKyojin: "Age of Titans (Godzilla Game) Script",
            titleZoshoku: "Duplication Item Script",
            btnDl: "Download",
            btnRaw: "RAW View",
            badgeAll: "All Games Supported",
            termsBtn: "Terms of Service",
            termsTitle: "Terms of Service",
            termsAgreeLabel: "I agree to the Terms of Service",
            btnDecline: "Decline",
            btnAgree: "Agree",
            btnCopy: "Copy",
            btnCopied: "Copied!",
            termsHtml: `
                <p>Please read these Terms of Service ("Terms") carefully before using the scripts distributed on this website ("Scripts").</p>

    let currentLang = 'ja';

    function setLanguage(lang) {
        currentLang = lang;
        const t = TRANSLATIONS[lang];

        document.getElementById('lang-toggle-btn').textContent = lang.toUpperCase();
        document.getElementById('site-desc').textContent = t.siteDesc;
        document.getElementById('title-kyojin').textContent = t.titleKyojin;
        document.getElementById('title-zoshoku').textContent = t.titleZoshoku;
        document.getElementById('badge-all-text').textContent = t.badgeAll;
        document.getElementById('terms-open-btn').textContent = t.termsBtn;
        document.getElementById('terms-modal-title').textContent = t.termsTitle;
        document.getElementById('terms-agree-checkbox-label').textContent = t.termsAgreeLabel;
        document.getElementById('terms-decline-btn').textContent = t.btnDecline;
        document.getElementById('terms-agree-btn').textContent = t.btnAgree;
        document.getElementById('terms-content-body').innerHTML = t.termsHtml;
        document.getElementById('btn-copy').textContent = t.btnCopy;

        document.querySelectorAll('.btn-dl-text').forEach(btn => btn.textContent = t.btnDl);
        document.querySelectorAll('.btn-raw-text').forEach(btn => btn.textContent = t.btnRaw);
    }

    async function initLanguage() {
        const savedLang = localStorage.getItem('user_lang');
        if (savedLang) {
            setLanguage(savedLang);
            return;
        }

        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            if (data.country_code === 'JP') {
                setLanguage('ja');
            } else {
                setLanguage('en');
            }
        } catch (e) {
            const userLang = navigator.language || navigator.userLanguage;
            if (userLang.startsWith('ja')) {
                setLanguage('ja');
            } else {
                setLanguage('en');
            }
        }
    }

    document.getElementById('lang-toggle-btn').addEventListener('click', () => {
        const newLang = currentLang === 'ja' ? 'en' : 'ja';
        localStorage.setItem('user_lang', newLang);
        setLanguage(newLang);
    });

    document.querySelectorAll('a').forEach(anchor => {
        anchor.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    });

    const SUN_SVG = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    const MOON_SVG = '<path d="M12.3 2a10 10 0 0 0 9.7 12.8A10 10 0 1 1 12.3 2z"/>';

    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');

    themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        themeIcon.innerHTML = isLight ? MOON_SVG : SUN_SVG;
    });

    document.querySelectorAll('.touch-target').forEach(el => {
        const removePressed = () => el.classList.remove('is-pressed');
        el.addEventListener('touchstart', () => el.classList.add('is-pressed'), { passive: true });
        el.addEventListener('touchend', removePressed);
        el.addEventListener('touchcancel', removePressed);
    });

    const LUA_FILES = {
        kyojin: {
            filename: '巨人の時代.lua',
            content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/gozila-game-roblox/refs/heads/main/gizlia%20sciprt.lua"))()'
        },
        zoshoku: {
            filename: '増殖アイテム.lua',
            content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/poopzous/refs/heads/main/unchikhub.lua"))()'
        }
    };

    function downloadLua(key) {
        const file = LUA_FILES[key];
        if (!file) return;

        const blob = new Blob([file.content], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 100);
    }

    const globalMenuBtn = document.getElementById('global-menu-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const uiCloseBtn = document.getElementById('ui-close-btn');

    globalMenuBtn.addEventListener('click', () => uiOverlay.classList.add('open'));
    uiCloseBtn.addEventListener('click', () => uiOverlay.classList.remove('open'));
    uiOverlay.addEventListener('click', e => { if (e.target === uiOverlay) uiOverlay.classList.remove('open'); });

    const termsOpenBtn = document.getElementById('terms-open-btn');
    const termsModal = document.getElementById('terms-modal');
    const termsModalCloseBtn = document.getElementById('terms-modal-close-btn');
    const termsActionArea = document.getElementById('terms-action-area');
    const termsCheckbox = document.getElementById('terms-checkbox');
    const termsAgreeBtn = document.getElementById('terms-agree-btn');
    const termsDeclineBtn = document.getElementById('terms-decline-btn');

    let pendingAction = null;
    let isAgreed = localStorage.getItem('terms_agreed') === 'true';

    termsOpenBtn.addEventListener('click', () => {
        termsActionArea.style.display = 'none';
        termsModal.classList.add('open');
    });

    const closeTermsModal = () => {
        termsModal.classList.remove('open');
        pendingAction = null;
    };

    termsModalCloseBtn.addEventListener('click', closeTermsModal);
    termsModal.addEventListener('click', e => { if (e.target === termsModal) closeTermsModal(); });

    termsCheckbox.addEventListener('change', () => {
        termsAgreeBtn.disabled = !termsCheckbox.checked;
    });

    termsDeclineBtn.addEventListener('click', () => {
        isAgreed = false;
        localStorage.removeItem('terms_agreed');
        closeTermsModal();
    });

    termsAgreeBtn.addEventListener('click', () => {
        if (!termsCheckbox.checked) return;
        isAgreed = true;
        localStorage.setItem('terms_agreed', 'true');
        termsModal.classList.remove('open');
        if (pendingAction) {
            pendingAction();
            pendingAction = null;
        }
    });

    const codeModal = document.getElementById('code-modal');
    const codeModalCloseBtn = document.getElementById('code-modal-close-btn');
    const codeTarget = document.getElementById('code-target');
    const codeModalFilename = document.getElementById('code-modal-filename');
    const btnCopy = document.getElementById('btn-copy');

    function openCodeModal(key) {
        const file = LUA_FILES[key];
        if (!file) return;
        codeModalFilename.textContent = file.filename;
        codeTarget.textContent = file.content;
        codeModal.classList.add('open');
    }

    function closeCodeModal() {
        codeModal.classList.remove('open');
        btnCopy.textContent = TRANSLATIONS[currentLang].btnCopy;
    }

    codeModalCloseBtn.addEventListener('click', closeCodeModal);
    codeModal.addEventListener('click', e => { if (e.target === codeModal) closeCodeModal(); });

    btnCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(codeTarget.textContent).then(() => {
            btnCopy.textContent = TRANSLATIONS[currentLang].btnCopied;
            setTimeout(() => btnCopy.textContent = TRANSLATIONS[currentLang].btnCopy, 2000);
        });
    });

    document.querySelectorAll('.file-card-actions button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const key = btn.getAttribute('data-file');
            const mode = btn.getAttribute('data-mode');

            const action = () => {
                if (mode === 'download') downloadLua(key);
                else if (mode === 'raw') openCodeModal(key);
            };

            if (isAgreed) {
                action();
            } else {
                pendingAction = action;
                termsCheckbox.checked = false;
                termsAgreeBtn.disabled = true;
                termsActionArea.style.display='block';
                termsModal.classList.add('open');
            }
        });
    });

    initLanguage();
    </script>
</body>
</html>
