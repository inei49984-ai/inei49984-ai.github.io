<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slcdax - Script</title>

<style>
:root{
    --bg:#080808;
    --panel:#111111;
    --panel2:#151515;
    --text:#f5f5f5;
    --muted:#999999;
    --border:#292929;
    --shadow:0 8px 30px rgba(0,0,0,.35);
}

body.light{
    --bg:#f5f5f5;
    --panel:#ffffff;
    --panel2:#fafafa;
    --text:#111111;
    --muted:#666666;
    --border:#dddddd;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.25s;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,8,8,.9);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
}

body.light header{
    background:rgba(255,255,255,.9);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    height:64px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.5px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-1px);
    background:var(--panel2);
}

/* MAIN */

.container{
    max-width:1100px;
    margin:auto;
    padding:42px 18px 70px;
}

.hero{
    margin-bottom:28px;
}

.hero-title{
    margin:0;
    font-size:42px;
    letter-spacing:-1.5px;
}

.site-description{
    margin:10px 0 0;
    color:var(--muted);
    line-height:1.7;
}

/* SEARCH */

.tools{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.search-wrap{
    position:relative;
    margin-bottom:14px;
}

.search{
    width:100%;
    height:48px;
    padding:0 48px 0 16px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:var(--panel2);
    color:var(--text);
    font-size:15px;
    transition:.2s;
}

.search:focus{
    border-color:var(--text);
}

.search::placeholder{
    color:var(--muted);
}

.search-icon{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
    color:var(--muted);
    pointer-events:none;
}

/* TABS */

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
}

.tab{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    padding:8px 15px;
    border-radius:999px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.tab:hover{
    transform:translateY(-1px);
}

.tab.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
}

/* FILTER */

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.filter{
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

.filter:hover{
    color:var(--text);
    border-color:var(--text);
}

.filter.active{
    color:var(--text);
    border-color:var(--text);
    background:var(--panel2);
}

/* RESULTS */

.results-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:24px 2px 12px;
}

.results-title{
    font-size:14px;
    font-weight:700;
}

.results-count{
    font-size:12px;
    color:var(--muted);
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
}

/* CARD */

.card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    box-shadow:var(--shadow);
    min-width:0;
    animation:resultIn .28s both;
    animation-delay:calc(var(--i) * .04s);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:translateY(10px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
}

.card-title{
    margin:0;
    font-size:17px;
    line-height:1.45;
}

.card-file{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
    word-break:break-all;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:14px;
}

.badge{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:3px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:11px;
}

/* 自作 */

.badge.self{
    color:#22c55e;
    border-color:#16a34a;
    background:rgba(34,197,94,.08);
}

/* キー必要 = 黄色 */

.badge.key{
    color:#facc15;
    border-color:#eab308;
    background:rgba(234,179,8,.08);
}

/* 全ゲーム対応 */

.badge.universal{
    color:#22c55e;
    border-color:#16a34a;
    background:rgba(34,197,94,.08);
}

.card-description{
    color:var(--muted);
    font-size:13px;
    line-height:1.65;
    margin:14px 0;
}

.card-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.btn{
    flex:1;
    min-height:40px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
    border-color:var(--text);
}

.btn.primary{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
}

/* EMPTY */

.empty{
    display:none;
    padding:45px 20px;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:16px;
    color:var(--muted);
    background:var(--panel);
}

.empty.show{
    display:block;
}

/* FOOTER */

footer{
    border-top:1px solid var(--border);
    color:var(--muted);
    text-align:center;
    padding:25px 15px;
    font-size:12px;
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(6px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(520px,100%);
    max-height:85vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.96) translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:16px;
}

.modal-title{
    margin:0;
    font-size:20px;
}

.close{
    width:34px;
    height:34px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
    cursor:pointer;
    font-size:18px;
}

.raw-code{
    width:100%;
    min-height:280px;
    resize:vertical;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#050505;
    color:#eee;
    font-family:Consolas,monospace;
    font-size:12px;
    line-height:1.6;
    outline:none;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.modal-buttons button{
    flex:1;
}

/* MENU */

.menu-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.menu-item{
    width:100%;
    text-align:left;
    padding:13px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--panel2);
    color:var(--text);
    cursor:pointer;
}

.menu-item:hover{
    border-color:var(--text);
}

/* TERMS */

.terms-text{
    color:var(--muted);
    line-height:1.8;
    font-size:13px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    z-index:1000;
    padding:10px 15px;
    border-radius:10px;
    background:var(--text);
    color:var(--bg);
    font-size:12px;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:650px){

    .container{
        padding-top:30px;
    }

    .hero-title{
        font-size:34px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .card-actions{
        flex-direction:column;
    }

    .header-inner{
        height:58px;
    }

    .tools{
        padding:13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">slcdax</div>

        <div class="header-actions">
            <button class="icon-btn" id="langBtn" title="Language">JA</button>
            <button class="icon-btn" id="themeBtn" title="Theme">☀</button>
            <button class="icon-btn" id="menuBtn" title="Menu">☰</button>
        </div>

    </div>
</header>


<main class="container">

    <section class="hero">
        <h1 class="hero-title" id="pageTitle">Script</h1>

        <p class="site-description" id="siteDesc">
            Roblox用スクリプトをまとめています。検索・カテゴリ・ゲーム別に探すことができます。

    <!-- SEARCH / TABS / FILTER -->

                type="text"

            >

            <span class="search-icon">⌕</span>

        </div>


        <div class="tabs">

            <button class="tab active" data-tab="all">
                すべて
            </button>

            <button class="tab" data-tab="self">

        </div>

    </section>


    <div class="results-head">

        <div class="results-title">
            Scripts
        </div>

        </div>

    </div>


    <section class="cards" id="cards"></section>


    <div class="empty" id="empty">
        該当するスクリプトがありません。
    </div>

</main>


<footer>
    slcdax © 2026
</footer>


<!-- RAW MODAL -->

<div class="overlay" id="rawOverlay">

    <div class="modal">

        <div class="modal-head">

            <h2 class="modal-title" id="rawTitle">
                RAW
            </h2>

            <button class="close" data-close="rawOverlay">

            </button>

        </div>


        <textarea
            class="raw-code"
            id="rawCode"
            readonly
        ></textarea>


        <div class="modal-buttons">

            <button class="btn primary" id="copyRaw">
                コピー
            </button>

            <button class="btn" data-close="rawOverlay">
                閉じる
            </button>

        </div>

    </div>

</div>


<!-- MENU MODAL -->

<div class="overlay" id="menuOverlay">

    <div class="modal">

        <div class="modal-head">

            <h2 class="modal-title">
                Menu
            </h2>

            <button class="close" data-close="menuOverlay">
                ×
            </button>

        </div>


        <div class="menu-list">

            <button class="menu-item" id="developerBtn">
                Developer SNS
            </button>

            <button class="menu-item" id="termsBtn">
                利用規約
            </button>

        </div>

    </div>

</div>


<!-- DEVELOPER -->

<div class="overlay" id="developerOverlay">

    <div class="modal">

        <div class="modal-head">

            <h2 class="modal-title">
                Developer SNS
            </h2>

            <button class="close" data-close="developerOverlay">
                ×
            </button>

        </div>


        <div class="menu-list">

            <button

<!-- TERMS -->

    <div class="modal">

        <div class="modal-head">

            <h2 class="modal-title">

            </h2>

            <button class="close" data-close="termsOverlay">
                ×

        </div>


        <div class="terms-text">

                当サイトで公開されているスクリプトの使用は自己責任で行ってください。
            </p>

                スクリプトについては、使用前に十分確認してください。
            </p>

            <p>
                当サイトはスクリプトの使用によって発生した問題について
                一切の責任を負いません。
            </p>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================
   SCRIPT DATA
========================= */

const SCRIPTS = [

    {
        id:"giant",

        name:"巨人の時代（ゴジラのゲーム）script",

        file:"巨人の時代.lua",

        tab:"self",

        game:"age",

        gameName:"巨人の時代",

        description:"Age of Titans / 巨人の時代用スクリプト。",

        badges:["self"],

        gameUrl:
            "https://www.roblox.com/ja/games/89851325271396/Age-of-Titans",

        code:
            'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/gozila-game-roblox/refs/heads/main/gizlia%20sciprt.lua"))()'
    },


    {
        id:"multiply",

        name:"増殖アイテム",

        file:"増殖アイテム.lua",

        tab:"self",

        game:"universal",

        gameName:"ユニバーサル",

        description:"アイテム増殖系のスクリプト。全ゲーム対応として登録されています。",

        badges:["self","universal"],

        gameUrl:null,

        code:
            'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/poopzous/refs/heads/main/unchikhub.lua"))()'
    },


    {
        id:"egg-hop",

        name:"卵を盗むホップ",

        file:"steal egg hop.lua",

        tab:"self",

        game:"egg",

        gameName:"卵を盗む",

        description:"Steal An Egg用のホップスクリプト。",

        badges:["self"],

        gameUrl:
            "https://www.roblox.com/ja/games/107778070777162/Steal-An-Egg",

        code:
            'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/egg_hop-workd/refs/heads/main/HOp%2Cluau"))()'
    },


    {
        id:"egg-steal",

        name:"卵を盗む(盗む専用)",

        file:"steal an egg script(stel only).lua",

        tab:"script",

        game:"egg",

        gameName:"卵を盗む",

        description:"卵を盗む専用のScript。使用にはキーが必要です。",

        badges:["key"],

        gameUrl:
            "https://www.roblox.com/ja/games/107778070777162/Steal-An-Egg",

        code:
            'loadstring(game:HttpGet("https://flowauth.net/v1/ui/584e23b68f5f361081321954763ab5e5.lua"))()'
    }

];


/* =========================
   STATE
========================= */

let currentTab = "all";
let currentFilter = "all";
let currentSearch = "";


/* =========================
   ELEMENTS
========================= */

const cards =
    document.getElementById("cards");

const empty =
    document.getElementById("empty");

const resultCount =
    document.getElementById("resultCount");

const searchInput =
    document.getElementById("searchInput");


/* =========================
   BADGES
========================= */

function getBadge(type){

    if(type === "self"){
        return `
            <span class="badge self">
                自作
            </span>
        `;
    }

    if(type === "key"){
        return `
            <span class="badge key">
                🔑 キー必要
            </span>
        `;
    }

    if(type === "universal"){
        return `
            <span class="badge universal">
                全ゲーム対応
            </span>
        `;
    }

    return "";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   RENDER
========================= */

function render(){

    const search =
        currentSearch.trim().toLowerCase();


    const filtered =
        SCRIPTS.filter(script=>{

            const scopeMatch =
                currentTab === "all" ||
                script.tab === currentTab;


            const gameMatch =
                currentFilter === "all" ||
                script.game === currentFilter;


            const text = `
                ${script.name}
                ${script.file}
                ${script.gameName}
                ${script.description}
            `.toLowerCase();


            const textMatch =
                !search ||
                text.includes(search);


            return (
                scopeMatch &&
                gameMatch &&
                textMatch
            );

        });


    cards.innerHTML = "";


    filtered.forEach((script,index)=>{

        const card =
            document.createElement("article");

        card.className = "card";

        card.style.setProperty(
            "--i",
            index
        );


        const badges =
            script.badges
                .map(getBadge)
                .join("");


        card.innerHTML = `

            <div class="card-top">

                <div>

                    <h2 class="card-title">
                        ${escapeHTML(script.name)}
                    </h2>

                    <div class="card-file">
                        ${escapeHTML(script.file)}
                    </div>

                </div>

            </div>


            <div class="badges">
                ${badges}
            </div>


            <p class="card-description">
                ${escapeHTML(script.description)}
            </p>


            <div class="card-actions">

                <button
                    class="btn primary"
                    data-action="raw"
                    data-id="${script.id}"
                >
                    RAW
                </button>


                <button
                    class="btn"
                    data-action="download"
                    data-id="${script.id}"
                >
                    ダウンロード
                </button>


                ${
                    script.gameUrl
                    ?
                    `
                    <button
                        class="btn"
                        data-action="game"
                        data-id="${script.id}"
                    >
                        ゲーム
                    </button>
                    `
                    :
                    ""
                }

            </div>
        `;


        cards.appendChild(card);

    });


    resultCount.textContent =
        `${filtered.length} 件`;


    if(filtered.length === 0){
        empty.classList.add("show");
    }else{
        empty.classList.remove("show");
    }

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    ()=>{
        currentSearch =
            searchInput.value;

        render();
    }
);


/* =========================
   TABS
========================= */

document.querySelectorAll(".tab")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
                .querySelectorAll(".tab")
                .forEach(x=>
                    x.classList.remove("active")
                );


            button.classList.add("active");


            currentTab =
                button.dataset.tab;


            render();

        }
    );

});


/* =========================
   FILTERS
========================= */

document.querySelectorAll(".filter")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
                .querySelectorAll(".filter")
                .forEach(x=>
                    x.classList.remove("active")
                );


            button.classList.add("active");


            currentFilter =
                button.dataset.game;


            render();

        }
    );

});


/* =========================
   CARD ACTIONS
========================= */

cards.addEventListener(
    "click",
    event=>{

        const button =
            event.target.closest("button");


        if(!button) return;


        const id =
            button.dataset.id;


        const script =
            SCRIPTS.find(
                x=>x.id === id
            );


        if(!script) return;


        const action =
            button.dataset.action;


        if(action === "raw"){
            openRaw(script);
        }


        if(action === "download"){
            downloadScript(script);
        }


        if(
            action === "game" &&
            script.gameUrl
        ){
            window.open(
                script.gameUrl,
                "_blank"
            );
        }

    }
);


/* =========================
   RAW
========================= */

const rawOverlay =
    document.getElementById("rawOverlay");

const rawTitle =
    document.getElementById("rawTitle");

const rawCode =
    document.getElementById("rawCode");


function openRaw(script){

    rawTitle.textContent =
        script.name;

    rawCode.value =
        script.code;

    rawOverlay.classList.add("show");

}


/* =========================
   COPY RAW
========================= */

document
.getElementById("copyRaw")
.addEventListener(
    "click",
    async()=>{

        try{

            await navigator.clipboard
                .writeText(rawCode.value);

            showToast(
                "コピーしました"
            );

        }catch{

            rawCode.select();

            document.execCommand(
                "copy"
            );

            showToast(
                "コピーしました"
            );

        }

    }
);


/* =========================
   DOWNLOAD
========================= */

function downloadScript(script){

    const blob =
        new Blob(
            [script.code],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        script.file;


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);


    showToast(
        "ダウンロードしました"
    );

}


/* =========================
   MODALS
========================= */

document
.querySelectorAll("[data-close]")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const id =
                button.dataset.close;


            document
                .getElementById(id)
                .classList.remove("show");

        }
    );

});


document
.querySelectorAll(".overlay")
.forEach(overlay=>{

    overlay.addEventListener(
        "click",
        event=>{

            if(
                event.target === overlay
            ){
                overlay.classList.remove(
                    "show"
                );
            }

        }
    );

});


document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            document
                .querySelectorAll(".overlay")
                .forEach(x=>
                    x.classList.remove("show")
                );

        }

    }
);


/* =========================
   MENU
========================= */

const menuOverlay =
    document.getElementById("menuOverlay");

const developerOverlay =
    document.getElementById(
        "developerOverlay"
    );

const termsOverlay =

    );


document

        );

document
.getElementById("termsBtn")
.addEventListener(
    "click",
    ()=>{

        menuOverlay.classList.remove(
            "show"
        );

        termsOverlay.classList.add(
            "show"
        );

    }
);


/* =========================
   THEME
   初期設定は黒
========================= */

const themeBtn =
    document.getElementById(
        "themeBtn"
    );


function updateThemeButton(){

    themeBtn.textContent =
        document.body.classList.contains(
            "light"
        )
        ? "☾"
        : "☀";

}


/*
    localStorageにlightが保存されていない限り
    黒を初期設定にする
*/

if(
    localStorage.getItem(
        "slcdax-theme"
    ) !== "light"
){

    document.body.classList.remove(
        "light"
    );

}else{

    document.body.classList.add(
        "light"
    );

}


updateThemeButton();


themeBtn.addEventListener(
    "click",
    ()=>{

        const isLight =
            document.body.classList.toggle(
                "light"
            );


        localStorage.setItem(
            "slcdax-theme",
            isLight
            ? "light"
            : "dark"
        );


        updateThemeButton();

    }
);


/* =========================
   LANGUAGE
========================= */

let english = false;


document
.getElementById("langBtn")
.addEventListener(
    "click",
    ()=>{

        english = !english;


        if(english){

            document
                .getElementById("langBtn")
                .textContent = "EN";


            document
                .getElementById("pageTitle")
                .textContent = "Script";


            document
                .getElementById("siteDesc")
                .textContent =
                    "Roblox scripts collected in one place. Search and filter scripts by category and game.";


            searchInput.placeholder =
                "Search scripts...";


        }else{

            document
                .getElementById("langBtn")
                .textContent = "JA";


            document
                .getElementById("pageTitle")
                .textContent = "Script";


            document
                .getElementById("siteDesc")
                .textContent =
                    "Roblox用スクリプトをまとめています。検索・カテゴリ・ゲーム別に探すことができます。";


            searchInput.placeholder =
                "スクリプトを検索...";

        }

    }
);


/* =========================
   TOAST
========================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================
   INITIAL RENDER
========================= */

render();

</script>
