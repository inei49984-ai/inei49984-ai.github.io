<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slcdax</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Space+Grotesk:wght@400;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 青い選択青枠・長押しメニューを全体で徹底的に無効化 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: #020510;
            color: #e2e8f0;
            position: relative;
            min-height: 180vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ====================================================
           BACKGROUND CANVAS
        ==================================================== */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ====================================================
           HAMBURGER MENU TRIGGER (右上配置)
        ==================================================== */
        .header-menu-trigger {
            position: fixed;
            top: 30px;
            right: 40px;
            left: auto;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1500;
            touch-action: manipulation;
            overflow: visible;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .header-menu-trigger::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 16px;
            background: transparent;
            border: 1.5px solid rgba(0, 210, 255, 0.6);
            transform: scale(0.7);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
            z-index: -1;
        }

        .menu-bar {
            height: 2px;
            background-color: #ffffff;
            transition: background-color 0.25s ease, width 0.25s ease;
            border-radius: 2px;
        }

        .bar-top { width: 28px; }
        .bar-mid { width: 20px; }
        .bar-bot { width: 25px; }

        .header-menu-trigger:hover,
        .header-menu-trigger.is-pressed {
            transform: scale(1.15);
        }
        .header-menu-trigger:hover::before,
        .header-menu-trigger.is-pressed::before {
            transform: scale(1);
            opacity: 1;
        }
        .header-menu-trigger:hover .menu-bar,
        .header-menu-trigger.is-pressed .menu-bar {
            background-color: #00d2ff;
            width: 32px;
        }

        /* ====================================================
           UI CONSOLE & MODALS
        ==================================================== */
        .ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(2, 5, 16, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .ui-overlay.open { opacity: 1; pointer-events: auto; }

        .ui-console {
            width: 90%;
            max-width: 500px;
            background: #080f22;
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.1);
            padding: 30px;
            position: relative;
            transform: scale(0.92) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ui-overlay.open .ui-console { transform: scale(1) translateY(0); }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .ui-title {
            font-size: 14px;
            font-weight: bold;
            color: #00d2ff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .ui-close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            transition: color 0.2s, transform 0.2s;
        }

        .ui-close-btn:hover,
        .ui-close-btn.is-pressed { color: #ffffff; transform: scale(1.2); }

        /* ====================================================
           DEVELOPER SNS UI
        ==================================================== */
        .sns-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sns-header-label {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sns-link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Discord / Github アイコンのカード（大きく手前に出て浮き上がる効果） */
        .sns-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(2, 5, 16, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.15);
            border-radius: 16px;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            touch-action: manipulation;
            position: relative;
            z-index: 1;
        }

        .sns-icon {
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .sns-icon svg {
            width: 100%;
            height: 100%;
            fill: #00d2ff;
            transition: transform 0.3s ease;
        }

        .sns-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* 手前に大きく迫り出すホバー・タップ中アニメーション */
        .sns-card:hover,
        .sns-card.is-pressed {
            z-index: 10;
            transform: translateY(-8px) scale(1.06);
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.35);
        }

        .sns-card:hover .sns-icon svg,
        .sns-card.is-pressed .sns-icon svg {
            transform: scale(1.2) rotate(6deg);
        }

        /* ====================================================
           RAW CODE MODAL STYLES
        ==================================================== */
        .code-modal-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .code-block-wrapper {
            background: #030814;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
            max-height: 250px;
            overflow-y: auto;
        }

        .code-block-wrapper pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .code-block-wrapper code {
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 13px;
            color: #38bdf8;
            line-height: 1.5;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .copy-btn-container {
            display: flex;
            justify-content: flex-end;
        }

        .btn-copy {
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid #00d2ff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy:hover,
        .btn-copy.is-pressed {
            background: rgba(0, 210, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .btn-copy.copied {
            background: #4ade80;
            color: #020510;
            border-color: #4ade80;
        }

        /* ====================================================
           SECTIONS & CARDS
        ==================================================== */
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0 20px;
            z-index: 10;
        }

        .brand-huge {
            font-size: clamp(65px, 16vw, 220px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -3px;
            line-height: 0.85;
            text-transform: lowercase;
            z-index: 10;
            text-align: center;
            text-shadow: 0 0 80px rgba(0, 210, 255, 0.15);
            cursor: default;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.4s ease;
        }

        .brand-huge span {
            color: #00d2ff;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
            transition: text-shadow 0.4s ease;
        }

        .brand-huge:hover,
        .brand-huge.is-pressed {
            transform: scale(1.08);
            text-shadow: 0 0 100px rgba(0, 210, 255, 0.4), 0 0 30px rgba(255, 255, 255, 0.6);
        }

        .brand-huge:hover span,
        .brand-huge.is-pressed span {
            text-shadow: 0 0 50px rgba(0, 210, 255, 1);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #24354b;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(6px); }
        }

        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 24px;
            text-align: center;
            z-index: 10;
        }

        .site-description {
            font-size: clamp(16px, 4vw, 22px);
            color: #94a3b8;
            max-width: 650px;
            line-height: 1.8;
            margin-bottom: 50px;
        }

        .file-card-group {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }

        /* ダウンロードやRAW表示を囲んでいるカード枠（大きく手前に出て浮き上がる効果） */
        .file-card {
            background: rgba(0, 210, 255, 0.03);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 20px;
            padding: 26px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            min-width: 240px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.06);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.35s ease, border-color 0.35s ease, background-color 0.35s ease;
            position: relative;
            z-index: 1;
        }

        /* 手前に大きく迫り出すホバー・タップ中アニメーション */
        .file-card:hover,
        .file-card.is-pressed {
            z-index: 10;
            transform: translateY(-12px) scale(1.07);
            box-shadow: 0 20px 45px rgba(0, 210, 255, 0.35);
            border-color: rgba(0, 210, 255, 0.85);
            background: rgba(0, 210, 255, 0.08);
        }

        .file-card-title { font-size: 15px; font-weight: 700; color: #ffffff; }
        .file-card-sub { font-size: 11px; color: #5b7290; margin-top: -10px; }

        .file-card-actions { display: flex; gap: 12px; }

        .game-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #00d2ff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            background: rgba(0, 210, 255, 0.05);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .game-link svg {
            width: 12px; height: 12px; stroke: #00d2ff;
            transition: transform 0.25s ease;
            pointer-events: none;
        }

        .game-link:hover,
        .game-link.is-pressed {
            transform: scale(1.08);
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            color: #ffffff;
        }

        .game-link:hover svg,
        .game-link.is-pressed svg {
            transform: rotate(15deg) scale(1.2);
        }

        .game-universal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #4ade80;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.35);
            background: rgba(74, 222, 128, 0.06);
        }

        .game-universal svg { width: 12px; height: 12px; stroke: #4ade80; }

        .action-trigger {
            background: rgba(0, 210, 255, 0.05);
            color: #00d2ff;
            border: 1px solid #00d2ff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: manipulation;
        }

        .action-trigger:hover,
        .action-trigger.is-pressed {
            transform: scale(1.1);
            background: #00d2ff;
            color: #020510;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
        }

        .action-trigger.raw-variant {
            color: #94a3b8;
            border-color: #4a5b73;
            background: rgba(255, 255, 255, 0.02);
        }

        .action-trigger.raw-variant:hover,
        .action-trigger.raw-variant.is-pressed {
            transform: scale(1.1);
            color: #ffffff;
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .footer-signature-container {
            margin-top: auto;
            width: 100%;
            padding: 60px 0 50px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(2, 5, 16, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 10;
        }

        .brand-signature {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(38px, 6vw, 65px);
            color: #94a3b8;
            opacity: 0.7;
            transition: transform 0.3s ease, opacity 0.3s ease, color 0.3s ease;
            cursor: default;
        }

        .brand-signature:hover,
        .brand-signature.is-pressed {
            transform: scale(1.1);
            opacity: 1;
            color: #00d2ff;
        }

        .signature-sub {
            font-size: 10px;
            color: #24354b;
            letter-spacing: 6px;
            margin-top: 10px;
        }
    </style>
</head>

    <!-- RAW Code Viewer Modal -->
    <div class="ui-overlay" id="code-modal">

            <div class="ui-header">
                <span class="ui-title" id="code-modal-filename">SCRIPT VIEW</span>

    <script>
    /* ====================================================
       TOUCH PRESSED EFFECT FOR MOBILE (タップ中のみ拡大)
    ==================================================== */
    document.querySelectorAll('.touch-target').forEach(el => {
        el.addEventListener('touchstart', () => el.classList.add('is-pressed'), { passive: true });
        el.addEventListener('touchend', () => el.classList.remove('is-pressed'));
        el.addEventListener('touchcancel', () => el.classList.remove('is-pressed'));
    });

    /* ====================================================
       PREVENT LONG-PRESS CONTEXT MENU ON LINKS & BUTTONS
    ==================================================== */
    window.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });

    /* ====================================================
       BACKGROUND CANVAS
    ==================================================== */
    (function() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        const STAR_COUNT = 130;
        const stars = Array.from({ length: STAR_COUNT }, () => {
            const layer = Math.random();
            return {
                x: Math.random(), y: Math.random(),
                r: 0.3 + layer * 1.8,
                a: 0.35 + layer * 0.55,
                tw: Math.random() * Math.PI * 2,
                vx: (Math.random() - 0.5) * (0.000015 + layer * 0.00008),
                vy: (Math.random() - 0.5) * (0.000010 + layer * 0.00005),
            };
        });

        const shoots = [];
        let nextShoot = 1000 + Math.random() * 2000;

        const GEO = Array.from({ length: 7 }, () => ({
            x: Math.random(), y: Math.random(),
            vx: (Math.random() - 0.5) * 0.00010,
            vy: (Math.random() - 0.5) * 0.00010
        }));

        const nebulaCanvas = document.createElement('canvas');
        function bakeNebula() {
            nebulaCanvas.width = W; nebulaCanvas.height = H;
            const nc = nebulaCanvas.getContext('2d');
            const blobs = [
                { x: 0.18, y: 0.25, rx: 0.32, r: 255, g: 60,  b: 120, a: 0.04 },
                { x: 0.78, y: 0.55, rx: 0.28, r: 60,  g: 80,  b: 255, a: 0.045},
                { x: 0.50, y: 0.82, rx: 0.38, r: 0,   g: 200, b: 255, a: 0.035},
                { x: 0.85, y: 0.15, rx: 0.20, r: 120, g: 0,   b: 255, a: 0.03 }
            ];
            blobs.forEach(n => {
                const px = n.x * W, py = n.y * H, rad = n.rx * W;
                const g = nc.createRadialGradient(px, py, 0, px, py, rad);
                g.addColorStop(0,   `rgba(${n.r},${n.g},${n.b},${n.a})`);
                g.addColorStop(0.5, `rgba(${n.r},${n.g},${n.b},${n.a * 0.35})`);
                g.addColorStop(1,   'rgba(0,0,0,0)');
                nc.fillStyle = g;
                nc.beginPath();
                nc.arc(px, py, rad, 0, Math.PI * 2);
                nc.fill();
            });
        }
        bakeNebula();
        window.addEventListener('resize', bakeNebula);

        function loop(t) {
            ctx.fillStyle = '#020510';
            ctx.fillRect(0, 0, W, H);
            ctx.drawImage(nebulaCanvas, 0, 0);

            nextShoot -= 16;
            if (nextShoot <= 0) {
                const edge = Math.floor(Math.random() * 3);
                let sx, sy, angle;
                if (edge === 0) { sx = Math.random(); sy = 0; angle = (20 + Math.random() * 40) * Math.PI / 180; }
                else if (edge === 1) { sx = 0; sy = Math.random() * 0.6; angle = (-20 + Math.random() * 40) * Math.PI / 180; }
                else { sx = 0.6 + Math.random() * 0.4; sy = 0; angle = Math.PI - (20 + Math.random() * 40) * Math.PI / 180; }
                const speed = 0.009 + Math.random() * 0.008;
                shoots.push({ x: sx, y: sy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, tail: [], bright: 0.6 + Math.random() * 0.4 });
                nextShoot = 900 + Math.random() * 1800;
            }

            stars.forEach(s => {
                s.x += s.vx; s.y += s.vy;
                if (s.x < 0) s.x = 1; if (s.x > 1) s.x = 0;
                if (s.y < 0) s.y = 1; if (s.y > 1) s.y = 0;
                const tw = 0.55 + Math.sin(t * 0.0009 + s.tw) * 0.45;
                ctx.globalAlpha = s.a * tw;
                ctx.fillStyle = s.r > 1.8 ? '#cceeff' : '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
                ctx.fill();
            });

            for (let i = shoots.length - 1; i >= 0; i--) {
                const sh = shoots[i];
                sh.tail.push({ x: sh.x, y: sh.y });
                if (sh.tail.length > 14) sh.tail.shift();
                sh.x += sh.vx; sh.y += sh.vy;
                sh.life -= 0.010;
                if (sh.life <= 0 || sh.x < -0.1 || sh.x > 1.1 || sh.y > 1.1) { shoots.splice(i, 1); continue; }

                sh.tail.forEach((pt, idx) => {
                    const prog = idx / sh.tail.length;
                    ctx.globalAlpha = prog * sh.life * sh.bright * 0.75;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = prog * 2.0;
                    if (idx > 0) {
                        const prev = sh.tail[idx - 1];
                        ctx.beginPath();
                        ctx.moveTo(prev.x * W, prev.y * H);
                        ctx.lineTo(pt.x * W, pt.y * H);
                        ctx.stroke();
                    }
                });
                ctx.globalAlpha = sh.life * sh.bright;
                ctx.fillStyle = '#aaeeff';
                ctx.beginPath();
                ctx.arc(sh.x * W, sh.y * H, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            GEO.forEach(n => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0) n.x = 1; if (n.x > 1) n.x = 0;
                if (n.y < 0) n.y = 1; if (n.y > 1) n.y = 0;
            });
            const DIST = 0.22;
            for (let i = 0; i < GEO.length; i++) {
                for (let j = i + 1; j < GEO.length; j++) {
                    const a = GEO[i], b = GEO[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < DIST) {
                        ctx.globalAlpha = (1 - d / DIST) * 0.15;
                        ctx.strokeStyle = '#00d2ff';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(a.x * W, a.y * H);
                        ctx.lineTo(b.x * W, b.y * H);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    })();

    /* ====================================================
       SYSTEM CONSOLE LOGIC
    ==================================================== */
    const globalMenuBtn = document.getElementById('global-menu-btn');
    const uiOverlay = document.getElementById('ui-overlay');
    const uiCloseBtn = document.getElementById('ui-close-btn');

    globalMenuBtn.addEventListener('click', () => uiOverlay.classList.add('open'));
    uiCloseBtn.addEventListener('click', () => uiOverlay.classList.remove('open'));
    uiOverlay.addEventListener('click', e => { if (e.target === uiOverlay) uiOverlay.classList.remove('open'); });

    /* ====================================================
       SCRIPT DATA & ACTIONS (.lua拡張子で保存)
    ==================================================== */
    const LUA_FILES = {
        kyojin: {
            filename: '巨人の時代.lua',
            content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/gozila-game-roblox/refs/heads/main/gizlia%20sciprt.lua"))()'
        },
        zoshoku: {
            filename: '増殖アイテム.lua',
            content: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/inei49984-ai/poopzous/refs/heads/main/unchikhub.lua"))()'
        }
    };

    function downloadLua(key) {
        const file = LUA_FILES[key];
        if (!file) return;
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        /* MIMEタイプを application/x-lua または octet-stream に設定することでスマホ側での .txt 自動補完を防ぐ */
        const blob = new Blob([bom, file.content], { type: 'application/x-lua;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }

    /* ====================================================
       RAW MODAL & COPY FUNCTIONALITY
    ==================================================== */
    const codeModal = document.getElementById('code-modal');
    const codeModalCloseBtn = document.getElementById('code-modal-close-btn');
    const codeTarget = document.getElementById('code-target');
    const codeModalFilename = document.getElementById('code-modal-filename');
    const btnCopy = document.getElementById('btn-copy');

    function openCodeModal(key) {
        const file = LUA_FILES[key];
        if (!file) return;

        codeModalFilename.textContent = file.filename;
        codeTarget.textContent = file.content;
        codeModal.classList.add('open');
    }

    function closeCodeModal() {
        codeModal.classList.remove('open');
        btnCopy.classList.remove('copied');
        btnCopy.textContent = 'コピー';
    }

    codeModalCloseBtn.addEventListener('click', closeCodeModal);
    codeModal.addEventListener('click', e => { if (e.target === codeModal) closeCodeModal(); });

    btnCopy.addEventListener('click', () => {
        const textToCopy = codeTarget.textContent;
        navigator.clipboard.writeText(textToCopy).then(() => {
            btnCopy.classList.add('copied');
            btnCopy.textContent = 'コピー完了！';
            setTimeout(() => {
                btnCopy.classList.remove('copied');
                btnCopy.textContent = 'コピー';
            }, 2000);
        }).catch(err => {
            console.error('Copy failed:', err);
        });
    });

    document.querySelectorAll('.file-card-actions .action-trigger').forEach(btn => {
        btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-file');
            const mode = btn.getAttribute('data-mode');
            if (mode === 'download') downloadLua(key);
            else if (mode === 'raw') openCodeModal(key);
        });
    });
    </script>
</body>
</html>
